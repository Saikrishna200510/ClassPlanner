name: Build and Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Windows Build (Standalone EXE & Inno Setup Wizard)
  # ============================================================================
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Compile Standalone Executable
        run: |
          pyinstaller --clean build_scripts/ClassPlanner.spec

      - name: Compile Inno Setup Installer Wizard
        run: |
          iscc build_scripts/windows_installer.iss

      - name: Verify Windows Installer
        run: |
          dir dist\ClassPlanner-v1.0.0-Windows-Setup.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/ClassPlanner-v1.0.0-Windows-Setup.exe
          if-no-files-found: error

  # ============================================================================
  # 2. macOS Build (.app & .dmg Installer)
  # ============================================================================
  build-macos:
    name: Build macOS Installer (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Compile Application Bundle
        run: |
          pyinstaller --clean build_scripts/ClassPlanner.spec

      - name: Package macOS DMG
        run: |
          chmod +x build_scripts/build_macos_dmg.sh
          bash build_scripts/build_macos_dmg.sh

      - name: Verify macOS DMG
        run: |
          ls -lh dist/ClassPlanner-v1.0.0-macOS.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/ClassPlanner-v1.0.0-macOS.dmg
          if-no-files-found: error

  # ============================================================================
  # 3. Linux Build (.deb and .AppImage Packages)
  # ============================================================================
  build-linux:
    name: Build Linux Packages (.deb & .AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon-x11-0 desktop-file-utils file

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Compile Linux Binary
        run: |
          pyinstaller --clean build_scripts/ClassPlanner.spec

      - name: Package Debian (.deb) & Universal AppImage
        run: |
          chmod +x build_scripts/build_linux_packages.sh
          bash build_scripts/build_linux_packages.sh

      - name: Verify Linux Packages
        run: |
          ls -lh dist/*.deb dist/*.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/classplanner_1.0.0_amd64.deb
            dist/ClassPlanner-v1.0.0-x86_64.AppImage
          if-no-files-found: error

  # ============================================================================
  # 4. Publish Release to GitHub Releases
  # ============================================================================
  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: tag_info
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release Directory
        run: mkdir -p release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release_assets/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release_assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: release_assets/

      - name: Generate Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ClassPlanner ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release_assets/ClassPlanner-v1.0.0-Windows-Setup.exe
            release_assets/ClassPlanner-v1.0.0-macOS.dmg
            release_assets/classplanner_1.0.0_amd64.deb
            release_assets/ClassPlanner-v1.0.0-x86_64.AppImage
            release_assets/SHA256SUMS.txt
          body: |
            ## ClassPlanner ${{ steps.tag_info.outputs.tag }}
            **Multi-College Automated Timetable Management System**

            Official cross-platform standalone installers for Windows, macOS, and Linux. No Python, VS Code, or development tools required.

            ---

            ### 📦 Download Links

            | Platform | Installer Package | Instructions |
            |---|---|---|
            | **Windows** | `ClassPlanner-v1.0.0-Windows-Setup.exe` | Run the setup wizard to install with Start Menu and Desktop shortcuts |
            | **macOS** | `ClassPlanner-v1.0.0-macOS.dmg` | Open the DMG and drag **ClassPlanner** to your `Applications` folder |
            | **Linux (Ubuntu/Debian)** | `classplanner_1.0.0_amd64.deb` | Install via `sudo dpkg -i classplanner_1.0.0_amd64.deb` |
            | **Linux (Universal)** | `ClassPlanner-v1.0.0-x86_64.AppImage` | Make executable (`chmod +x`) and run directly |

            > **🍎 macOS Note (First Launch)**:
            > Because ClassPlanner is distributed outside the Apple Mac App Store, macOS Gatekeeper may prompt *"Apple could not verify..."* on first launch.
            > **To open**: Drag **ClassPlanner** into `/Applications`, then **Right-Click ➔ Open** (or go to **System Settings ➔ Privacy & Security ➔ Click "Open Anyway"**).

            ---

            ### 🚀 Features Included
            - **Multi-College Management**: Super Admin and College Admin segregated portals.
            - **Hard-Constraint Scheduling**: Automated collision-free weekly schedules (faculty, rooms, sections, labs).
            - **Multi-Perspective Timetable Views**: Section-wise, Faculty-wise, Classroom-wise, Department-wise.
            - **Interactive In-Place Editor**: Live collision detection and cell swapping.
            - **Document Exports**: Institutional PDF (ReportLab) and Excel (OpenPyXL).
            - **Security & Cloud Sync**: PostgreSQL Row Level Security (RLS) on Supabase with offline SQLite fallback.

            ### 🔐 Default Credentials
            - **Super Admin Portal**: `superadmin@classplanner.edu` / `Admin@12345`
            - **College Admin Portal**: `admin@gec.edu` / `College@12345`

            ### 🛡️ Checksums
            Verify your downloads using the attached `SHA256SUMS.txt`.

